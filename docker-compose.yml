services:
  db:
    image: postgres:16
    container_name: rewardrail-db
    environment:
      POSTGRES_USER: rewardrail
      POSTGRES_PASSWORD: rewardrail
      POSTGRES_DB: rewardrail
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates a second database, rewardrail_test, used only by the e2e tests.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewardrail"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
